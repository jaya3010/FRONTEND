

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }
    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#111827,#1e293b);
        color:white;
    }
    .player{
        width:360px;
        background:#0f172a;
        padding:25px;
        border-radius:20px;
        box-shadow:0 8px 20px rgba(0,0,0,0.5);
    }
    .cover{
        width:100%;
        height:250px;
        border-radius:15px;
        object-fit:cover;
        margin-bottom:20px;
    }
    .song-info{
        text-align:center;
        margin-bottom:20px;
    }
    .song-info h2{
        font-size:24px;
        margin-bottom:5px;
    }
    .song-info p{
        color:#cbd5e1;
    }
    .progress-container{
        width:100%;
        height:6px;
        background:#334155;
        border-radius:10px;
        cursor:pointer;
        margin:15px 0;
    }
    .progress{
        height:100%;
        width:0%;
        background:#38bdf8;
        border-radius:10px;
    }
    .time{
        display:flex;
        justify-content:space-between;
        font-size:14px;
        color:#cbd5e1;
    }
    .controls{
        display:flex;
        justify-content:center;
        align-items:center;
        gap:20px;
        margin:25px 0;
    }
    .controls button{
        border:none;
        background:#1e293b;
        color:white;
        padding:15px;
        border-radius:50%;
        cursor:pointer;
        font-size:18px;
        transition:0.3s;
    }
    .controls button:hover{
        background:#38bdf8;
        transform:scale(1.1);
    }
    .play-btn{
        background:#38bdf8 !important;
        padding:18px !important;
    }
    .volume{
        margin:20px 0;
    }
    .volume label{
        display:block;
        margin-bottom:8px;
    }
    .volume input{
        width:100%;
    }
    .playlist{
        margin-top:20px;
    }
    .playlist h3{
        margin-bottom:10px;
        color:#38bdf8;
    }
    .playlist ul{
        list-style:none;
    }
    .playlist li{
        padding:10px;
        margin-bottom:8px;
        background:#1e293b;
        border-radius:10px;
        cursor:pointer;
        transition:0.3s;
    }
    .playlist li:hover{
        background:#334155;
    }
    @media(max-width:400px){
        .player{
            width:95%;
        }
    }
</style>
</head>
<body>
<div class="player">
    <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1200&auto=format&fit=crop"
         class="cover"
         id="cover">
    <div class="song-info">
        <h2 id="title">Song Title</h2>
        <p id="artist">Artist Name</p>
    </div>
    <!-- AUDIO -->
    <audio id="audio"></audio>
    <!-- PROGRESS -->
    <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>
    </div>
    <div class="time">
        <span id="current-time">0:00</span>
   �
