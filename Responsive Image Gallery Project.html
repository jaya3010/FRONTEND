


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }
    h1 {
      margin: 20px 0;
      color: #333;
    }
    .filters {
      margin-bottom: 20px;
    }
    .filters button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      background: #333;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.3s;
    }
    .filters button:hover {
      background: #ff6600;
      transform: scale(1.05);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.4s ease, filter 0.4s ease;
    }
    .gallery img:hover {
      transform: scale(1.05);
      filter: brightness(80%) grayscale(20%);
    }
    #lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
    }
    #lightbox img {
      max-width: 85%;
      max-height: 80%;
      border-radius: 10px;
      animation: zoom 0.3s ease;
    }
    @keyframes zoom {
      from {
        transform: scale(0.7);
      }
      to {
        transform: scale(1);
      }
    }
    .close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: white;
      font-size: 40px;
      cursor: pointer;
    }
    .controls {
      margin-top: 20px;
    }
    .controls button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      background: #ff6600;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      transition: 0.3s;
    }
    .controls button:hover {
      background: #ff3300;
    }
    @media (max-width: 600px) {
      .gallery img {
        height: 200px;
      }
      #lightbox img {
        max-width: 95%;
      }
    }
  </style>
</head>
<body>
  <h1>Responsive Image Gallery</h1>
  <div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
  </div>
  <div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" class="nature" onclick="openLightbox(0)">
    <img src="https://picsum.photos/id/1011/600/400" class="city" onclick="openLightbox(1)">
    <img src="https://picsum.photos/id/1016/600/400" class="nature" onclick="openLightbox(2)">
    <img src="https://picsum.photos/id/1020/600/400" class="city" onclick="openLightbox(3)">
    <img src="https://picsum.photos/id/1039/600/400" class="nature" onclick="openLightbox(4)">
    <img src="https://picsum.photos/id/1043/600/400" class="city" onclick="openLightbox(5)">
  </div>
  <div id="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img">
